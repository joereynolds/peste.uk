<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PESTE | UK Punk / Prog / Hardcore</title>
  <meta name="description" content="Peste is a UK punk/prog/hardcore band. Plagues, pestilence & heavy riffs.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header class="header">
      <h1 class="brand-title">PESTE</h1>
      <div class="brand-subtitle">UK Hardcore / Prog / Punk</div>
      <div style="margin-top: 1rem;">
        <a href="epk/index.html" style="font-family: var(--font-punk); font-size: 0.9rem; letter-spacing: 0.1em; color: var(--red-bright); text-decoration: none; transition: color 0.2s ease;">PRESS KIT →</a>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      
      <!-- BIO / MANIFESTO -->
      <section>
        <p class="bio-text">
          UK progressive hardcore.
        </p>
      </section>

      <!-- LINEUP SECTION -->
      <section>
        <div class="section-heading">LINEUP</div>
        
        <div class="members-grid">
          <div class="member-card">
            <div class="member-photo-box">
              <img src="assets/images/headshot-george.jpeg" alt="George - Vocals">
            </div>
            <div class="member-info">
              <h3 class="member-name">GEORGE</h3>
              <div class="member-role">VOCALS</div>
            </div>
          </div>

          <div class="member-card">
            <div class="member-photo-box">
              <img src="assets/images/headshot-joe.jpeg" alt="Joe - Guitar">
            </div>
            <div class="member-info">
              <h3 class="member-name">JOE</h3>
              <div class="member-role">GUITAR</div>
            </div>
          </div>

          <div class="member-card">
            <div class="member-photo-box">
              <img src="assets/images/headshot-lew.jpeg" alt="Lew - Drums">
            </div>
            <div class="member-info">
              <h3 class="member-name">LEW</h3>
              <div class="member-role">DRUMS</div>
            </div>
          </div>

          <div class="member-card vacant-card">
            <div class="member-photo-box question-box">
              <span class="question-mark">?</span>
            </div>
            <div class="member-info">
              <h3 class="member-name vacant-title">VACANT</h3>
              <div class="member-role vacant-role">BASS</div>
            </div>
          </div>
        </div>
      </section>

      <!-- CONTACT & SOCIALS -->
      <section class="contact-box">
        <div class="section-heading">CONTACT & BOOKING</div>
        <p style="color:var(--grey-muted); font-size:0.95rem;">For gig bookings, press & enquiries:</p>
        <a href="mailto:pesteuk@gmail.com" class="email-link">pesteuk@gmail.com</a>

        <div class="social-links">
          <a href="https://instagram.com/pesteband" target="_blank" rel="noopener noreferrer" class="social-link">INSTAGRAM</a>
        </div>
      </section>

    </main>

  </div>

</body>
</html>
